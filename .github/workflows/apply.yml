# Etapa 3: después del merge, planear UN entorno (solo lo tocado) y aplicar ESE plan con aprobación manual.
name: Apply

on:
  push:
    branches: [main]
    paths:
      - "mi-project/**"
  workflow_dispatch: # para promover a otro entorno o regenerar un plan obsoleto
    inputs:
      entorno:
        description: Entorno
        type: choice
        options: [dev, qa]
        default: dev
      unidad:
        description: "Unidad (vacío = todas). Ej: ec2 (incluye sus dependencias)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  detectar:
    runs-on: ubuntu-latest
    outputs:
      entorno: ${{ steps.que.outputs.entorno }}
      filtros: ${{ steps.que.outputs.filtros }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: que
        uses: ./.github/actions/entornos
        with:
          base: ${{ github.event.before }}
          entorno: ${{ inputs.entorno }}
          unidad: ${{ inputs.unidad }}
          compartido: nada

  plan:
    needs: detectar
    if: needs.detectar.outputs.entorno != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ENTORNO: ${{ needs.detectar.outputs.entorno }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          role-arn: ${{ vars.AWS_ROLE_PLAN_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - id: plan
        uses: ./.github/actions/plan
        with:
          entorno: ${{ needs.detectar.outputs.entorno }}
          filtros: ${{ needs.detectar.outputs.filtros }}

      - name: Resumen
        env:
          RESUMEN: ${{ steps.plan.outputs.resumen }}
        run: |
          printf '### Plan %s (commit %s)\n%s\nPlan completo: artefacto **plan-%s**.\n' \
            "$ENTORNO" "${GITHUB_SHA::7}" "$RESUMEN" "$ENTORNO" >> "$GITHUB_STEP_SUMMARY"

      - name: Plan en txt (descargable)
        uses: actions/upload-artifact@v7
        with:
          name: plan-${{ needs.detectar.outputs.entorno }}
          path: plan-${{ needs.detectar.outputs.entorno }}.txt
          retention-days: 7

      - name: Planes binarios para el apply
        uses: actions/upload-artifact@v7
        with:
          name: planes-${{ needs.detectar.outputs.entorno }}
          path: |
            planes/${{ needs.detectar.outputs.entorno }}
            plan-${{ needs.detectar.outputs.entorno }}.txt
            mi-project/live/${{ needs.detectar.outputs.entorno }}/*/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 7

  apply:
    needs: [detectar, plan]
    runs-on: ubuntu-latest
    environment: ${{ needs.detectar.outputs.entorno }} # acá frena y pide aprobación
    permissions:
      contents: read
      id-token: write
    env:
      ENTORNO: ${{ needs.detectar.outputs.entorno }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          role-arn: ${{ vars.AWS_ROLE_APPLY_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/download-artifact@v8
        with:
          name: planes-${{ needs.detectar.outputs.entorno }}
          path: .

      - name: Plan aprobado
        run: cat "plan-$ENTORNO.txt"

      - name: terragrunt apply (mismo plan)
        working-directory: mi-project/live/${{ needs.detectar.outputs.entorno }}
        env:
          FILTROS: ${{ needs.detectar.outputs.filtros }}
          PLANES: ${{ github.workspace }}/planes/${{ needs.detectar.outputs.entorno }}
          TG_NON_INTERACTIVE: "true"
          TG_NO_TIPS: "true"
          TG_PROVIDER_CACHE: "1"
        run: |
          # Mismas unidades que el plan.
          args=()
          while read -r f; do [ -n "$f" ] && args+=(--filter "$f"); done <<< "$FILTROS"

          terragrunt run --all apply --out-dir "$PLANES" "${args[@]}" -- -input=false -no-color

      - name: Si falló
        if: failure()
        run: |
          echo "### ❌ Apply \`$ENTORNO\` falló" >> "$GITHUB_STEP_SUMMARY"
          echo "Si dice **Saved plan is stale**, el state cambió: corré Actions → Apply → Run workflow y aprobá el plan nuevo." >> "$GITHUB_STEP_SUMMARY"
